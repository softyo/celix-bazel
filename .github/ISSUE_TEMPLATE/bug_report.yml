name: 🐛 Bug Report
description: Report a bug in celix-bazel
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug! Please provide as much detail as possible to help us reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: "The framework fails to link when using the static archive..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this? Please provide a minimal Bazel example or a link to a repository.
      placeholder: |
        1. Clone celix-bazel
        2. Run `bazel build //framework:framework_static`
        3. Inspect the generated library...
    validations:
      required: true

  - type: input
    id: bazel_version
    attributes:
      label: Bazel Version
      description: Output of `bazel version`
      placeholder: "e.g., bazel 7.1.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Linux
        - macOS
        - Windows
        - Other
    validations:
      required: true

  - type: textarea
    id: expected_actual
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen, and what actually happened?
      placeholder: |
        **Expected:** `//framework:framework_static` builds and links cleanly
        **Actual:** The build fails or symbols are undefined

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I have checked that this issue is not already reported.
          required: true
        - label: I have provided a minimal reproducible example.
          required: false
